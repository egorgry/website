<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Crate — a record collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #17140f;
    --ink-2: #221c14;
    --ink-3: #2c241a;
    --paper: #ece3ce;
    --paper-dim: #b8ae95;
    --brass: #b98d4f;
    --brass-bright: #d4a666;
    --rust: #a3462f;
    --sage: #6e7f6b;
    --serif: 'Fraunces', serif;
    --sans: 'Space Grotesk', sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: var(--brass-bright); text-decoration: none; }
  a:hover{ text-decoration: underline; }

  /* subtle warm vignette + felt-like grain feel via layered gradients */
  body{
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(185,141,79,0.08), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(163,70,47,0.06), transparent 55%);
  }

  .wrap{ max-width: 1100px; margin: 0 auto; padding: 0 28px; }

  /* ---------- header ---------- */
  header.site{
    padding: 48px 0 32px;
  }
  header.site .wrap{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }
  .site-title{
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: 0.2px;
    margin: 0;
  }
  .site-title .fine{
    font-family: var(--sans);
    font-size: 13px;
    color: var(--paper-dim);
    display:block;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .stats{
    display:flex;
    align-items:center;
    gap: 10px;
    font-size: 13px;
    color: var(--paper-dim);
  }
  .stats .dot{
    width:5px; height:5px; border-radius:50%;
    background: var(--brass);
    display:inline-block;
  }
  .stats b{ color: var(--paper); font-weight: 600; }

  /* ---------- now spinning hero ---------- */
  .hero{
    padding: 20px 0 64px;
    border-bottom: 1px solid rgba(236,227,206,0.08);
    margin-bottom: 56px;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap: 56px;
    align-items: center;
  }
  @media (max-width: 720px){
    .hero .wrap{ grid-template-columns: 1fr; gap: 32px; }
  }

  .platter{
    position: relative;
    width: 280px;
    height: 280px;
    justify-self: center;
  }
  .vinyl{
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0e0c09 0px, #0e0c09 2px,
        #1a1611 3px, #1a1611 4px
      );
    box-shadow: 0 20px 50px -10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
    animation: spin 9s linear infinite paused;
  }
  .vinyl.playing{ animation-play-state: running; }
  .vinyl::before{
    content:'';
    position:absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.05), transparent 45%);
  }
  .label{
    position: absolute;
    top: 50%; left: 50%;
    width: 96px; height: 96px;
    margin: -48px 0 0 -48px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--ink);
    box-shadow: 0 0 0 1px rgba(236,227,206,0.15);
    background-size: cover;
    background-position: center;
  }
  .label::after{
    content:'';
    position:absolute; top:50%; left:50%;
    width:8px; height:8px; margin:-4px 0 0 -4px;
    background: var(--ink); border-radius:50%;
  }
  .tonearm{
    position: absolute;
    top: -18px; right: -34px;
    width: 130px; height: 130px;
    transform-origin: 96% 12%;
    transform: rotate(-24deg);
    transition: transform 0.9s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .platter.playing .tonearm{ transform: rotate(2deg); }
  .tonearm svg{ width:100%; height:100%; }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .now-spinning-copy .eyebrow{
    font-size: 12px;
    color: var(--rust);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .now-spinning-copy h2{
    font-family: var(--serif);
    font-size: clamp(30px, 4vw, 46px);
    font-weight: 500;
    margin: 0 0 6px;
    line-height: 1.08;
  }
  .now-spinning-copy .artist{
    font-size: 18px;
    color: var(--brass-bright);
    margin: 0 0 18px;
  }
  .meta-row{
    display:flex; gap: 18px; flex-wrap: wrap;
    font-size: 13px; color: var(--paper-dim);
    margin-bottom: 20px;
  }
  .genre-pill{
    display:inline-block;
    padding: 4px 10px;
    border: 1px solid rgba(236,227,206,0.18);
    border-radius: 999px;
    font-size: 12px;
    color: var(--sage);
    margin: 2px 6px 0 0;
  }

  /* ---------- crates ---------- */
  .crate{ margin-bottom: 52px; }
  .crate-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .crate-head h3{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    margin: 0;
  }
  .crate-head span{
    font-size: 13px;
    color: var(--paper-dim);
  }

  .shelf{
    display:flex;
    overflow-x: auto;
    padding: 10px 6px 26px;
    scroll-snap-type: x proximity;
  }
  .shelf::-webkit-scrollbar{ height: 6px; }
  .shelf::-webkit-scrollbar-thumb{ background: var(--ink-3); border-radius: 4px; }

  .record{
    flex: 0 0 auto;
    width: 148px;
    margin-left: -34px;
    scroll-snap-align: start;
    position: relative;
    transition: transform 0.25s ease, margin 0.25s ease, z-index 0s;
    cursor: default;
  }
  .record:first-child{ margin-left: 0; }
  .record:nth-child(3n+1){ transform: rotate(-2.5deg); }
  .record:nth-child(3n+2){ transform: rotate(1.5deg); }
  .record:nth-child(3n){ transform: rotate(-1deg); }

  .record:hover{
    transform: translateY(-14px) rotate(0deg) scale(1.04);
    z-index: 5;
    margin-right: 20px;
  }

  .sleeve{
    width: 148px; height: 148px;
    border-radius: 3px;
    background: var(--ink-3) center/cover no-repeat;
    box-shadow: 0 10px 22px -8px rgba(0,0,0,0.55);
    position: relative;
  }
  .sleeve::after{
    content:'';
    position:absolute; inset:0;
    border-radius:3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
  }

  .tag{
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    margin-top: 8px;
    font-size: 12px;
    line-height: 1.35;
  }
  .record:hover .tag{ opacity: 1; transform: translateY(0); }
  .tag .t{ color: var(--paper); font-weight: 600; }
  .tag .a{ color: var(--paper-dim); }

  /* ---------- states ---------- */
  .status{
    text-align:center;
    color: var(--paper-dim);
    padding: 80px 0;
    font-size: 15px;
  }
  .status.error{ color: var(--rust); }
  .note{
    text-align:center;
    font-size: 12px;
    color: var(--paper-dim);
    margin-top: -30px;
    margin-bottom: 40px;
  }

  footer{
    border-top: 1px solid rgba(236,227,206,0.08);
    padding: 28px 0 60px;
    font-size: 13px;
    color: var(--paper-dim);
    text-align: center;
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <h1 class="site-title">The Crate<span class="fine">a running catalog of records worth keeping</span></h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero" style="display:none;">
    <div class="wrap" style="padding:0;">
      <div class="platter" id="platter">
        <div class="tonearm">
          <svg viewBox="0 0 130 130">
            <circle cx="112" cy="16" r="9" fill="var(--brass)" />
            <rect x="18" y="12" width="96" height="5" rx="2.5" fill="var(--brass)" transform="rotate(28 112 16)" />
            <circle cx="20" cy="58" r="4" fill="var(--paper)" />
          </svg>
        </div>
        <div class="vinyl" id="vinyl">
          <div class="label" id="heroLabel"></div>
        </div>
      </div>
      <div class="now-spinning-copy">
        <p class="eyebrow">Now spinning — most recently added</p>
        <h2 id="heroTitle"></h2>
        <p class="artist" id="heroArtist"></p>
        <div class="meta-row" id="heroMeta"></div>
        <div id="heroGenres"></div>
      </div>
    </div>
  </section>

  <div id="crates"></div>
  <div class="status" id="status">Warming up the needle…</div>
</main>

<footer>
  Built with the Discogs API on Cloudflare Pages.
</footer>

<script>
async function loadCollection(){
  const statusEl = document.getElementById('status');
  try{
    const res = await fetch('/api/collection');
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    if(!data.releases || !data.releases.length) throw new Error('empty');
    render(data.releases);
    statusEl.remove();
  }catch(err){
    // Local preview or the Function isn't deployed yet — fall back to a
    // small demo set so the page still shows what it looks like.
    render(demoData());
    statusEl.textContent = 'Showing sample records — connect /api/collection to see your own.';
    statusEl.classList.remove('error');
    statusEl.style.padding = '0 0 40px';
  }
}

function render(releases){
  document.getElementById('stats').innerHTML = statsHTML(releases);

  const hero = releases[0];
  document.getElementById('hero').style.display = '';
  document.getElementById('heroLabel').style.backgroundImage = `url("${hero.coverImage}")`;
  document.getElementById('heroTitle').textContent = hero.title;
  document.getElementById('heroArtist').textContent = hero.artist;
  document.getElementById('heroMeta').textContent = [hero.year, hero.label].filter(Boolean).join('  ·  ');
  document.getElementById('heroGenres').innerHTML = (hero.genres || [])
    .map(g => `<span class="genre-pill">${g}</span>`).join('');

  const platter = document.getElementById('platter');
  const vinyl = document.getElementById('vinyl');
  setTimeout(() => { platter.classList.add('playing'); vinyl.classList.add('playing'); }, 400);

  const crates = groupByGenre(releases);
  const cratesEl = document.getElementById('crates');
  cratesEl.innerHTML = crates.map(crateHTML).join('');
}

function statsHTML(releases){
  const genres = new Set();
  releases.forEach(r => (r.genres || []).forEach(g => genres.add(g)));
  return `
    <span><b>${releases.length}</b> records</span>
    <span class="dot"></span>
    <span><b>${genres.size}</b> genres</span>
  `;
}

function groupByGenre(releases){
  const map = new Map();
  releases.forEach(r => {
    const key = (r.genres && r.genres[0]) || 'Unsorted';
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(r);
  });
  return [...map.entries()]
    .sort((a,b) => b[1].length - a[1].length)
    .map(([genre, records]) => ({ genre, records }));
}

function crateHTML({ genre, records }){
  return `
    <section class="crate">
      <div class="crate-head">
        <h3>${genre}</h3>
        <span>${records.length} record${records.length === 1 ? '' : 's'}</span>
      </div>
      <div class="shelf">
        ${records.map(recordHTML).join('')}
      </div>
    </section>
  `;
}

function recordHTML(r){
  return `
    <div class="record">
      <div class="sleeve" style="background-image:url('${r.coverImage}')"></div>
      <div class="tag">
        <div class="t">${r.title}</div>
        <div class="a">${r.artist}${r.year ? ' · ' + r.year : ''}</div>
      </div>
    </div>
  `;
}

function demoData(){
  const cover = (seed) => `https://picsum.photos/seed/${seed}/300/300`;
  return [
    { title:'Kind of Blue Skies', artist:'The Modal Trio', year:1961, label:'Blue Note', genres:['Jazz'], coverImage: cover('a1') },
    { title:'Wandering Static', artist:'Nils Aho', year:2018, label:'Warp', genres:['Electronic'], coverImage: cover('a2') },
    { title:'Low Country', artist:'Marla Vance', year:1974, label:'Stax', genres:['Soul'], coverImage: cover('a3') },
    { title:'Second Hand Sun', artist:'The Alright', year:1996, label:'Sub Pop', genres:['Rock'], coverImage: cover('a4') },
    { title:'Nightbus', artist:'Kaito Reyes', year:2021, label:'Ghostly', genres:['Electronic'], coverImage: cover('a5') },
    { title:'Salt Air', artist:'June Pallas', year:1988, label:'ECM', genres:['Jazz'], coverImage: cover('a6') },
    { title:'Concrete Garden', artist:'Vero Line', year:1979, label:'Rough Trade', genres:['Rock'], coverImage: cover('a7') },
  ];
}

loadCollection();
</script>
</body>
</html>
